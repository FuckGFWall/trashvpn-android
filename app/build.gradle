plugins {
    id 'com.android.application'
}

def localDebugKey = rootProject.file('.local/android-debug.keystore')

android {
    namespace = 'com.leo.trashvpn'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.leo.trashvpn'
        minSdk = 26
        targetSdk = 36
        versionCode = 10
        versionName = '1.0.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug' // Debug signing must never claim the public package ID.
        }
    }

    // The in-app language selector must work offline even from a future Play bundle.
    bundle {
        language {
            enableSplit = false
        }
    }

    // A machine-local debug key can keep upgrades compatible with an installed test build.
    // A fresh checkout uses the standard Android debug signing configuration.
    if (localDebugKey.isFile()) {
        signingConfigs {
            debug {
                storeFile = localDebugKey
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true // The JNI facade loads from nativeLibraryDir.
    }
}

def coreAar = rootProject.layout.projectDirectory.file('.deps/libmihomo-android-v0.3.14.aar')
def verifyMihomo = tasks.register('verifyMihomo') {
    doLast {
        def file = coreAar.asFile
        if (!file.isFile()) {
            throw new GradleException('Missing Mihomo AAR. Run tools/fetch-mihomo.ps1 first.')
        }
        def sha256 = java.security.MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            for (int n; (n = input.read(buffer)) != -1;) sha256.update(buffer, 0, n)
        }
        if (sha256.digest().encodeHex().toString() != '7c3a68a4ef9afcb5018e167dc70fba7485652d0a0e29ba006703cf00fed9e230') {
            throw new GradleException('Mihomo AAR hash mismatch. Re-run tools/fetch-mihomo.ps1.')
        }
    }
}
tasks.named('preBuild') { dependsOn(verifyMihomo) }

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.87'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    implementation files(coreAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.21'
    testImplementation 'junit:junit:4.13.2'
}
